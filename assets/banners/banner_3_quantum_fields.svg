<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%" style="background: #030712; border-radius: 16px;">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15082e"/>
      <stop offset="50%" stop-color="#070c1e"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="quantumGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9d4edd"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#f72585"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="350" fill="url(#bgGrad3)" rx="16"/>

  <!-- Wave Interference Ripples (Double Slit) -->
  <g opacity="0.35" stroke="url(#quantumGrad3)" fill="none" stroke-width="1.5">
    <!-- Slit 1 Ripples -->
    <circle cx="450" cy="180" r="40"/>
    <circle cx="450" cy="180" r="80"/>
    <circle cx="450" cy="180" r="120"/>
    <circle cx="450" cy="180" r="160"/>
    <!-- Slit 2 Ripples -->
    <circle cx="750" cy="180" r="40"/>
    <circle cx="750" cy="180" r="80"/>
    <circle cx="750" cy="180" r="120"/>
    <circle cx="750" cy="180" r="160"/>
  </g>

  <!-- Central Quantum Wavefunction -->
  <path d="M50,180 Q150,110 250,180 T450,180 T650,180 T850,180 T1050,180 T1150,180" fill="none" stroke="#00f2fe" stroke-width="2.5" filter="url(#glow3)"/>
  <path d="M50,180 Q150,250 250,180 T450,180 T650,180 T850,180 T1050,180 T1150,180" fill="none" stroke="#f72585" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>

  <!-- Formula Callouts -->
  <g transform="translate(180, 260)">
    <rect x="-80" y="-18" width="160" height="36" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#9d4edd" stroke-width="1"/>
    <text x="0" y="5" font-family="'Fira Code', monospace" font-size="12" fill="#c084fc" text-anchor="middle" font-weight="bold">iℏ ∂Ψ/∂t = ĤΨ</text>
  </g>

  <g transform="translate(600, 260)">
    <rect x="-80" y="-18" width="160" height="36" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#00f2fe" stroke-width="1"/>
    <text x="0" y="5" font-family="'Fira Code', monospace" font-size="12" fill="#00f2fe" text-anchor="middle" font-weight="bold">Δx · Δp ≥ ℏ/2</text>
  </g>

  <g transform="translate(1020, 260)">
    <rect x="-80" y="-18" width="160" height="36" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#f72585" stroke-width="1"/>
    <text x="0" y="5" font-family="'Fira Code', monospace" font-size="12" fill="#f472b6" text-anchor="middle" font-weight="bold">E = mc² = hν</text>
  </g>

  <!-- Title -->
  <text x="600" y="48" font-family="Inter, sans-serif" font-size="18" fill="#c084fc" font-weight="800" text-anchor="middle" letter-spacing="1.5">
    ⚛️ KUANTUM MEKANİĞİ VE ALAN TEORİSİ
  </text>
  <text x="600" y="72" font-family="'Fira Code', monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">
    "Doğada katı parçacıklar temel değildir; temel olan sürekli titreşen Kuantum Alanlarıdır."
  </text>
</svg>
