<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" style="background: #030712; border-radius: 16px;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c1e"/>
      <stop offset="50%" stop-color="#0c1538"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyanPurple1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#f72585"/>
    </linearGradient>
    <linearGradient id="goldAmber1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="glow1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad1)" rx="16"/>

  <!-- Grid Pattern -->
  <g opacity="0.12" stroke="#00f2fe" stroke-width="0.75">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="750" y1="0" x2="750" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1050" y1="0" x2="1050" y2="400"/>
  </g>

  <!-- Cosmic Particles / Stars -->
  <g opacity="0.6">
    <circle cx="80" cy="50" r="1.5" fill="#ffffff" />
    <circle cx="220" cy="120" r="2" fill="#00f2fe" filter="url(#softGlow1)" />
    <circle cx="340" cy="60" r="1" fill="#ffffff" />
    <circle cx="500" cy="90" r="2.5" fill="#9d4edd" filter="url(#softGlow1)" />
    <circle cx="680" cy="40" r="1.5" fill="#ffffff" />
    <circle cx="820" cy="80" r="2" fill="#f72585" filter="url(#softGlow1)" />
    <circle cx="980" cy="50" r="1" fill="#00f2fe" />
    <circle cx="1120" cy="110" r="2" fill="#ffffff" />
    <circle cx="150" cy="330" r="1.5" fill="#ffd166" />
    <circle cx="420" cy="350" r="2" fill="#00f2fe" />
    <circle cx="780" cy="340" r="1" fill="#ffffff" />
    <circle cx="1060" cy="320" r="2.5" fill="#06d6a0" filter="url(#softGlow1)" />
  </g>

  <!-- 3 Stages Evolution Visualization -->

  <!-- STAGE 1: Ancient Arche & Atomos (Left) -->
  <g transform="translate(180, 200)">
    <!-- Temple Pillars Silhouette -->
    <path d="M-60,70 L-60,20 M-40,70 L-40,20 M-20,70 L-20,20 M-70,20 L-10,20 M-65,70 L-15,70" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <!-- Atomos Sphere -->
    <circle cx="20" cy="0" r="36" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#glow1)"/>
    <circle cx="20" cy="0" r="18" fill="#f59e0b" opacity="0.3"/>
    <text x="20" y="5" font-family="'Fira Code', monospace" font-size="11" fill="#ffd166" text-anchor="middle" font-weight="bold">ATOMOS</text>
    <text x="0" y="85" font-family="Inter, sans-serif" font-size="13" fill="#ffd166" text-anchor="middle" font-weight="bold">1. MADDE &amp; ARKHE</text>
    <text x="0" y="105" font-family="'Fira Code', monospace" font-size="10" fill="#94a3b8" text-anchor="middle">MÖ 600 - 1900</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 330,200 L 410,200" stroke="url(#cyanPurple1)" stroke-width="2" stroke-dasharray="4,4" opacity="0.7"/>
  <polygon points="415,200 405,195 405,205" fill="#9d4edd"/>

  <!-- STAGE 2: Quantum & Energy E=mc2 (Center) -->
  <g transform="translate(600, 200)">
    <!-- Orbit Ellipses -->
    <ellipse cx="0" cy="0" rx="55" ry="22" fill="none" stroke="#9d4edd" stroke-width="1.5" transform="rotate(25)" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="55" ry="22" fill="none" stroke="#00f2fe" stroke-width="1.5" transform="rotate(-25)" opacity="0.8"/>
    <circle cx="0" cy="0" r="12" fill="#f72585" filter="url(#glow1)"/>
    <!-- Electron particle -->
    <circle cx="46" cy="18" r="4.5" fill="#00f2fe" filter="url(#glow1)"/>
    <text x="0" y="5" font-family="'Fira Code', monospace" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">E=mc²</text>
    <text x="0" y="85" font-family="Inter, sans-serif" font-size="13" fill="#c084fc" text-anchor="middle" font-weight="bold">2. ENERJİ &amp; ALAN</text>
    <text x="0" y="105" font-family="'Fira Code', monospace" font-size="10" fill="#94a3b8" text-anchor="middle">1900 - 1960</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 750,200 L 830,200" stroke="url(#cyanPurple1)" stroke-width="2" stroke-dasharray="4,4" opacity="0.7"/>
  <polygon points="835,200 825,195 825,205" fill="#00f2fe"/>

  <!-- STAGE 3: Digital Physics & It from Bit (Right) -->
  <g transform="translate(1000, 200)">
    <!-- Holographic Cube Wireframe -->
    <polygon points="0,-40 38,-18 38,25 0,45 -38,25 -38,-18" fill="rgba(0, 242, 254, 0.08)" stroke="#00f2fe" stroke-width="1.5" filter="url(#softGlow1)"/>
    <line x1="0" y1="45" x2="0" y2="-5" stroke="#00f2fe" stroke-width="1.2"/>
    <line x1="-38" y1="-18" x2="0" y2="-5" stroke="#00f2fe" stroke-width="1.2"/>
    <line x1="38" y1="-18" x2="0" y2="-5" stroke="#00f2fe" stroke-width="1.2"/>
    <!-- Binary Streams -->
    <text x="0" y="2" font-family="'Fira Code', monospace" font-size="10" fill="#00f2fe" text-anchor="middle" font-weight="bold">|Ψ⟩=|0⟩+|1⟩</text>
    <text x="0" y="85" font-family="Inter, sans-serif" font-size="13" fill="#00f2fe" text-anchor="middle" font-weight="bold">3. BİLGİ / IT FROM BIT</text>
    <text x="0" y="105" font-family="'Fira Code', monospace" font-size="10" fill="#94a3b8" text-anchor="middle">1960 - Günümüz</text>
  </g>

  <!-- Top Title Overlay -->
  <text x="600" y="55" font-family="Inter, sans-serif" font-size="20" fill="#ffffff" font-weight="900" text-anchor="middle" letter-spacing="2">
    EVRENİN BÜYÜK ONTOLOJİK DÖNÜŞÜMÜ
  </text>
  <text x="600" y="80" font-family="'Fira Code', monospace" font-size="12" fill="#00f2fe" text-anchor="middle" letter-spacing="1">
    From Matter (Atomos) → Energy (E=mc²) → Information (It from Bit)
  </text>
</svg>
